openapi: 3.0.3
info:
  title: DevOrbit Host Bridge & Connection Broker API
  # NOTE (Master Plan 26): the former Control Plane service was removed. Any control-plane paths
  # documented below are deprecated and no longer served; pairing, session authorization and
  # revocation are provided by the Host Bridge and Connection Broker.
  deprecated: false
  version: 1.2.0
  description: Official OpenAPI contract governing DevOrbit mobile client, control plane, host bridge, and connection broker RPC/REST endpoints.

paths:
  /api/v1/health:
    get:
      summary: Health check endpoint for host bridge daemon
      operationId: healthCheck
      responses:
        '200':
          description: Operational status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /api/v1/auth/pair:
    post:
      summary: Legacy direct machine pairing endpoint
      operationId: pairMachine
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PairingRequest'
      responses:
        '200':
          description: Pairing successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PairingResponse'

  /api/v1/pairing/challenge:
    post:
      summary: Generate single-use QR code pairing challenge on Host Bridge
      operationId: createPairingChallenge
      responses:
        '200':
          description: Single-use pairing challenge generated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PairingChallengeResponse'

  /api/v1/pairing/confirm:
    post:
      summary: Confirm QR pairing with device identity proof
      operationId: confirmPairing
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PairingConfirmRequest'
      responses:
        '200':
          description: Pairing confirmed & session token issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PairingResponse'
        '400':
          description: Expired challenge, invalid signature, or replayed challenge

  /api/v1/auth/register-device:
    post:
      summary: Register paired device identity on Control Plane
      operationId: registerDevice
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterDeviceRequest'
      responses:
        '200':
          description: Device registered successfully

  /api/v1/auth/revoke-device:
    post:
      summary: Revoke trusted device identity
      operationId: revokeDevice
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RevokeDeviceRequest'
      responses:
        '200':
          description: Device revoked successfully

  /api/v1/sessions/authorize:
    post:
      summary: Authorize a mobile session for LAN or Connection Broker connection
      operationId: authorizeSession
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionAuthorizeRequest'
      responses:
        '200':
          description: Session authorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionAuthorizeResponse'
        '403':
          description: Device revoked or unauthorized permissions

  /api/v1/workspaces:
    get:
      summary: List configured and allowed workspaces on host
      operationId: listWorkspaces
      responses:
        '200':
          description: List of workspaces
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Workspace'

  /api/v1/workspaces/discover:
    post:
      summary: Discover Android Studio, Gradle, and Git projects under search roots
      operationId: discoverWorkspaces
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DiscoverWorkspacesRequest'
      responses:
        '200':
          description: Discovered projects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Workspace'

  /api/v1/files/list:
    post:
      summary: List files and subdirectories in a workspace directory
      operationId: listDirectory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ListDirectoryRequest'
      responses:
        '200':
          description: Directory contents
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListDirectoryResponse'

  /api/v1/files/read:
    post:
      summary: Read content of a file within an allowed workspace
      operationId: readFile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReadFileRequest'
      responses:
        '200':
          description: File content retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadFileResponse'
        '403':
          description: Access denied (path outside allowed workspace)

  /api/v1/files/write:
    post:
      summary: Write content to a file with SHA256 conflict detection
      operationId: writeFile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WriteFileRequest'
      responses:
        '200':
          description: File written successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WriteFileResponse'
        '409':
          description: Conflict detected (file modified on host)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConflictResponse'

  /api/v1/git/status:
    post:
      summary: Retrieve Git repository status for a workspace
      operationId: getGitStatus
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkspacePathRequest'
      responses:
        '200':
          description: Git status summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GitStatusResponse'

  /api/v1/git/diff:
    post:
      summary: Retrieve Git diff for a workspace
      operationId: getGitDiff
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkspacePathRequest'
      responses:
        '200':
          description: Git diff text
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GitDiffResponse'

  /api/v1/processes/execute:
    post:
      summary: Start a controlled process execution (git, gradlew, adb)
      operationId: executeProcess
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExecuteProcessRequest'
      responses:
        '200':
          description: Process started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcessResponse'

  /api/v1/processes/{id}:
    get:
      summary: Query status of a running or completed process
      operationId: getProcessStatus
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Process status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcessResponse'

  /api/v1/processes/{id}/cancel:
    post:
      summary: Cancel a running process
      operationId: cancelProcess
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Process cancelled

  /api/v1/devices/adb:
    get:
      summary: List connected Android ADB devices
      operationId: listADBDevices
      responses:
        '200':
          description: List of ADB devices
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ADBDevice'

components:
  schemas:
    HealthResponse:
      type: object
      required:
        - status
        - os
        - host_bridge_version
      properties:
        status:
          type: string
        os:
          type: string
        host_bridge_version:
          type: string
        allowed_workspaces_count:
          type: integer

    PairingRequest:
      type: object
      required:
        - machine_id
        - host_public_key
        - pairing_code
      properties:
        machine_id:
          type: string
        host_public_key:
          type: string
        pairing_code:
          type: string

    PairingChallengeResponse:
      type: object
      required:
        - challenge_id
        - host_id
        - host_public_key
        - host_name
        - pairing_payload
        - expires_at
      properties:
        challenge_id:
          type: string
        host_id:
          type: string
        host_public_key:
          type: string
        host_name:
          type: string
        pairing_payload:
          type: string
        expires_at:
          type: string
          format: date-time

    PairingConfirmRequest:
      type: object
      required:
        - challenge_id
        - device_id
        - device_name
        - device_public_key
        - proof_signature
      properties:
        challenge_id:
          type: string
        device_id:
          type: string
        device_name:
          type: string
        device_public_key:
          type: string
        proof_signature:
          type: string

    PairingResponse:
      type: object
      required:
        - session_token
        - expires_at
      properties:
        session_token:
          type: string
        expires_at:
          type: string
          format: date-time

    RegisterDeviceRequest:
      type: object
      required:
        - machine_id
        - device_id
        - device_name
        - device_public_key
      properties:
        machine_id:
          type: string
        device_id:
          type: string
        device_name:
          type: string
        device_public_key:
          type: string

    RevokeDeviceRequest:
      type: object
      required:
        - machine_id
        - device_id
      properties:
        machine_id:
          type: string
        device_id:
          type: string

    SessionAuthorizeRequest:
      type: object
      required:
        - machine_id
        - device_id
        - connection_mode
      properties:
        machine_id:
          type: string
        device_id:
          type: string
        connection_mode:
          type: string # "lan" or "internet"

    SessionAuthorizeResponse:
      type: object
      required:
        - session_id
        - session_token
        - expires_at
        - e2e_session_key
      properties:
        session_id:
          type: string
        session_token:
          type: string
        expires_at:
          type: string
          format: date-time
        e2e_session_key:
          type: string

    Workspace:
      type: object
      required:
        - id
        - name
        - root_path
        - is_android_project
      properties:
        id:
          type: string
        name:
          type: string
        root_path:
          type: string
        is_android_project:
          type: boolean
        has_gradle:
          type: boolean
        has_git:
          type: boolean

    DiscoverWorkspacesRequest:
      type: object
      properties:
        search_roots:
          type: array
          items:
            type: string
        max_depth:
          type: integer

    WorkspacePathRequest:
      type: object
      required:
        - workspace_id
      properties:
        workspace_id:
          type: string

    ListDirectoryRequest:
      type: object
      required:
        - workspace_id
        - relative_path
      properties:
        workspace_id:
          type: string
        relative_path:
          type: string

    ListDirectoryResponse:
      type: object
      required:
        - relative_path
        - entries
      properties:
        relative_path:
          type: string
        entries:
          type: array
          items:
            $ref: '#/components/schemas/FileEntry'

    FileEntry:
      type: object
      required:
        - name
        - relative_path
        - is_directory
        - size_bytes
      properties:
        name:
          type: string
        relative_path:
          type: string
        is_directory:
          type: boolean
        size_bytes:
          type: integer
        mod_time:
          type: string

    ReadFileRequest:
      type: object
      required:
        - workspace_id
        - relative_path
      properties:
        workspace_id:
          type: string
        relative_path:
          type: string

    ReadFileResponse:
      type: object
      required:
        - relative_path
        - content
        - sha256_hash
        - is_binary
      properties:
        relative_path:
          type: string
        content:
          type: string
        sha256_hash:
          type: string
        is_binary:
          type: boolean
        size_bytes:
          type: integer

    WriteFileRequest:
      type: object
      required:
        - workspace_id
        - relative_path
        - new_content
        - base_sha256
      properties:
        workspace_id:
          type: string
        relative_path:
          type: string
        new_content:
          type: string
        base_sha256:
          type: string

    WriteFileResponse:
      type: object
      required:
        - relative_path
        - updated_sha256
      properties:
        relative_path:
          type: string
        updated_sha256:
          type: string

    ConflictResponse:
      type: object
      required:
        - error
        - current_content
        - current_sha256
      properties:
        error:
          type: string
        current_content:
          type: string
        current_sha256:
          type: string

    GitStatusResponse:
      type: object
      required:
        - branch
        - is_clean
      properties:
        branch:
          type: string
        is_clean:
          type: boolean
        staged_files:
          type: array
          items:
            type: string
        unstaged_files:
          type: array
          items:
            type: string
        untracked_files:
          type: array
          items:
            type: string

    GitDiffResponse:
      type: object
      required:
        - diff_text
      properties:
        diff_text:
          type: string

    ExecuteProcessRequest:
      type: object
      required:
        - workspace_id
        - command
        - args
      properties:
        workspace_id:
          type: string
        command:
          type: string
        args:
          type: array
          items:
            type: string
        timeout_seconds:
          type: integer

    ProcessResponse:
      type: object
      required:
        - process_id
        - command
        - status
      properties:
        process_id:
          type: string
        command:
          type: string
        status:
          type: string
        exit_code:
          type: integer
        stdout:
          type: string
        stderr:
          type: string

    ADBDevice:
      type: object
      required:
        - serial
        - state
      properties:
        serial:
          type: string
        state:
          type: string
        model:
          type: string
        product:
          type: string
