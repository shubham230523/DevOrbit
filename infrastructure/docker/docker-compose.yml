version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: devorbit-postgres
    environment:
      POSTGRES_USER: devorbit
      POSTGRES_PASSWORD: devorbit_password
      POSTGRES_DB: devorbit_db
    ports:
      - "5432:5432"
    volumes:
      - devorbit_pg_data:/var/lib/postgresql/data
      - ../database/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devorbit -d devorbit_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  control-plane:
    build:
      context: ../../
      dockerfile: infrastructure/docker/Dockerfile.control-plane
    container_name: devorbit-control-plane
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: "postgres://devorbit:devorbit_password@postgres:5432/devorbit_db?sslmode=disable"
      JWT_SECRET: "devorbit_development_jwt_secret_key"
    depends_on:
      postgres:
        condition: service_healthy

  connection-broker:
    build:
      context: ../../
      dockerfile: infrastructure/docker/Dockerfile.connection-broker
    container_name: devorbit-connection-broker
    ports:
      - "8081:8081"
    depends_on:
      - control-plane

volumes:
  devorbit_pg_data:
